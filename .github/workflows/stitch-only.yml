name: stitch-only
on:
  workflow_dispatch:
    inputs:
      title:
        description: "Output file title"
        default: "Meteran"
      total:
        description: "Total frames"
        default: "2421"
      run_id:
        description: "Run ID dari render sebelumnya (kosongkan = otomatis cari run yang punya chunk)"
        default: ""
      zip:
        description: "Project zip file name (kosongkan jika sudah terekstrak)"
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  stitch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project zip (when the repository holds only the .zip)
        shell: bash
        env:
          ZIP_INPUT: ${{ inputs.zip }}
        run: |
          set -e
          if [ -f build.mjs ] && [ -d src ]; then echo "project already extracted, nothing to do"; exit 0; fi
          Z="$ZIP_INPUT"; [ -n "$Z" ] || Z=$(ls -1 *.zip 2>/dev/null | head -n1)
          if [ -z "$Z" ] || [ ! -f "$Z" ]; then echo "No project .zip found."; exit 1; fi
          rm -rf _unzipped && mkdir _unzipped
          unzip -q "$Z" -d _unzipped || python3 -c "import sys,zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$Z" _unzipped
          B=$(find _unzipped -name build.mjs -not -path '*/__MACOSX/*' -not -path '*/node_modules/*' | head -n1)
          cp -a "$(dirname "$B")"/. .
          rm -rf _unzipped
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Download chunks from previous render
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -e
          RUN_ID="$INPUT_RUN_ID"
          if [ -z "$RUN_ID" ]; then
            for id in $(gh run list --limit 10 --json databaseId --jq '.[].databaseId'); do
              HAS=$(gh api "repos/${{ github.repository }}/actions/runs/$id/artifacts" --jq '[.artifacts[] | select(.name == "chunk-0" and .expired == false)] | length')
              if [ "$HAS" -gt 0 ]; then
                RUN_ID="$id"
                break
              fi
            done
          fi
          if [ -z "$RUN_ID" ]; then
            echo "Tidak ada run sebelumnya yang masih menyimpan artifact chunk-0 (mungkin sudah kedaluwarsa > 24 jam)."
            exit 1
          fi
          echo "Mengunduh chunks dari Run ID: $RUN_ID"
          mkdir -p _chunks_dl chunks
          gh run download "$RUN_ID" -p "chunk-*" -D _chunks_dl
          find _chunks_dl -type f -name "*.mp4" -exec mv {} chunks/ \;
          rm -rf _chunks_dl
          ls -la chunks/
      - name: Stitch final video
        shell: bash
        env:
          RAW_TITLE: ${{ inputs.title }}
          RAW_TOTAL: ${{ inputs.total }}
        run: |
          set -e
          TITLE="$(printf '%s' "$RAW_TITLE" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          [ -n "$TITLE" ] || TITLE="short"
          TOTAL="$(printf '%s' "$RAW_TOTAL" | tr -dc '0-9')"
          python3 -c '
          import re
          p = "ci/stitch.sh"
          s = open(p).read()
          s = s.replace("csv=p=0", "default=noprint_wrappers=1:nokey=1")
          s = re.sub(
              r"^(\s*(?:local\s+)?)([A-Za-z_][A-Za-z0-9_]*)=.*ffprobe.*$",
              lambda m: m.group(0) + "\n" + m.group(1) + m.group(2) + "=$(printf %s \"$" + m.group(2) + "\" | tr -dc 0-9)",
              s,
              flags=re.M,
          )
          open(p, "w").write(s)
          '
          bash ci/stitch.sh "$TITLE" "$TOTAL"
      - uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: out/*
          retention-days: 7
